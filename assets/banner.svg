<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="KEEFLOW Frontend Engineer banner">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#15102d"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity=".09"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="990" cy="100" r="125" fill="#6366f1" opacity=".18" filter="url(#glow)"/>
  <circle cx="180" cy="300" r="100" fill="#0ea5e9" opacity=".12" filter="url(#glow)"/>
  <rect x="45" y="36" width="1110" height="248" rx="12" fill="none" stroke="#a5b4fc" stroke-opacity=".22"/>
  <circle cx="76" cy="61" r="5" fill="#fb7185"/><circle cx="95" cy="61" r="5" fill="#fbbf24"/><circle cx="114" cy="61" r="5" fill="#34d399"/>
  <text x="150" y="66" font-family="monospace" font-size="15" fill="#94a3b8">~/keeflow/profile</text>
  <text x="600" y="163" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="78" letter-spacing="10" fill="url(#accent)">KEEFLOW</text>
  <text x="600" y="207" text-anchor="middle" font-family="monospace" font-size="19" letter-spacing="4" fill="#cbd5e1">FRONTEND ENGINEER  /  CREATIVE DEVELOPER</text>
  <path d="M425 231H775" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <text x="600" y="257" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2" fill="#94a3b8">DESIGN  ×  CODE  ×  EXPERIENCE</text>
</svg>
